# Builds the three platforms on a version tag and attaches them to a draft
# release.
#
# The draft is not published. A build nobody has opened is not a release, and
# the one thing that cannot be checked from here is whether the artifact
# actually starts on the machine it was built for.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The gate runs once, on the cheapest runner, before any platform is built.
  # A tag pushed on a tree that fails its own checks should produce nothing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The launch and screen checks need a display, which a headless runner
      # does not have. xvfb provides one.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm run verify

  build:
    needs: verify
    strategy:
      # One platform failing should not cancel the other two. A release with
      # two of three artifacts is still worth publishing while the third is
      # investigated.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # macOS is built with the Developer ID certificate and the notary
      # credentials. Without them electron-builder finds no identity and the
      # notarization hooks skip themselves, so the build still succeeds and
      # produces a DMG that Gatekeeper refuses. That failure is silent here and
      # only shows on the machine of the person who downloads it.
      - if: matrix.os == 'macos-latest'
        run: npm run ${{ matrix.script }}
        env:
          # electron-builder publishes on its own if this is unset, which would
          # put artifacts on the release before anybody has opened one.
          GH_TOKEN: ''
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The Apple credentials are kept away from the other two platforms.
      # electron-builder reads CSC_LINK for Windows signing as well, and handed
      # the Apple certificate it would try to sign the installer with it.
      - if: matrix.os != 'macos-latest'
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ''
      # Checked on the runner, before the draft exists. A failure here fails
      # this job, and since the draft waits on every build, no draft is created
      # until it is fixed.
      #
      # Two things are checked for each DMG. The DMG must carry a stapled
      # notarization ticket, so it opens without a network check. The
      # application inside must pass Gatekeeper as notarized Developer ID code,
      # which is the judgment macOS makes when someone launches it. The DMG
      # itself is not signed, following electron-builder's advice that a signed
      # DMG conflicts with notarization, so Gatekeeper is asked about the
      # application and not about the DMG's own signature, which it lacks.
      - if: matrix.os == 'macos-latest'
        run: |
          for dmg in dist/*.dmg; do
            xcrun stapler validate "$dmg"
            mount=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
            spctl --assess --type execute --verbose=2 "$mount/Chenoot.app"
            xcrun stapler validate "$mount/Chenoot.app"
            hdiutil detach "$mount" >/dev/null
          done
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: artifacts/**/*
          # Notes are written by hand from the changelog. Generated notes read
          # like a commit log because that is what they are.
          generate_release_notes: false
